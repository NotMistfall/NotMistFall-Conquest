plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // Minecraft 26.x is unobfuscated; the non-remapping Loom uses plain
    // `implementation` (not `modImplementation`) and needs no `mappings` line.
    implementation "net.fabricmc:fabric-loader:${loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
}

// Dependency-free unit tests for the Minecraft-free core model. They are plain
// Java (no JUnit) so they run identically in CI and on a bare JDK.
tasks.register('coreTests', JavaExec) {
    group = 'verification'
    description = 'Runs the core model tests.'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'notmistfalls.conquest.CoreTests'
}

tasks.named('check') {
    dependsOn 'coreTests'
}
test {
    failOnNoDiscoveredTests = false
}
